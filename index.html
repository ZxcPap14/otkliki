};

  .map(([k,v])=>`<div class="stat"><b>${v}</b>${k}</div>`).join("");
const F = [["ch","все","все"],["ch","fj","сайт: отклик"],["ch","fj-msg","сайт: письмо"],["ch","mail","e-mail"],["ch","tg","telegram"],
           ["st","все","статус: любой"],["st","нет ответа","ждём"],["st","отказ","отказ"]];
